name: PR Sentinel review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-sentinel-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # Check out the PR head (not the merge commit) so static-analysis line numbers
      # match the lines GitHub shows in the diff.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # In another repo, replace `./` with `hamzaakrm/pr-sentinel@v1` (your published action).
      - uses: ./
        with:
          provider: gemini             # or: anthropic / openai / ollama / fake
          min-severity: low
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
